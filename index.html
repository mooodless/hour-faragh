<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>ساعة فراغ - العائلة</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2c7a7b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ساعة فراغ" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- شاشة كلمة المرور -->
  <div id="lockScreen">
    <div class="lock-box">
      <h1>🔒 ساعة فراغ</h1>
      <p>تطبيق العائلة الخاص</p>
      <input type="password" id="passInput" placeholder="كلمة مرور العائلة" />
      <button id="passBtn">دخول</button>
      <p id="passError" class="error"></p>
    </div>
  </div>

  <!-- التطبيق -->
  <div id="app" class="hidden">
    <header>
      <h1>⏳ ساعة فراغ</h1>
      <p>وش نسوي الحين؟</p>
    </header>

    <main>
      <section class="card">
        <label>كم وقتك؟</label>
        <div class="chips" id="timeChips">
          <button data-val="30">30 دقيقة</button>
          <button data-val="60">ساعة</button>
          <button data-val="120">ساعتين</button>
          <button data-val="999">أكثر</button>
        </div>
      </section>

      <section class="card">
        <label>وش مزاجك؟</label>
        <div class="chips" id="moodChips">
          <button data-val="كوفي">☕ كوفي</button>
          <button data-val="مطعم">🍽️ مطعم</button>
          <button data-val="حديقة">🌳 حديقة</button>
          <button data-val="سينما">🎬 سينما</button>
        </div>
      </section>

      <section class="card">
        <label>المدينة (اختياري)</label>
        <div class="chips" id="cityChips">
          <button data-val="" class="active">تلقائي (موقعي)</button>
          <button data-val="الخبر">الخبر</button>
          <button data-val="الدمام">الدمام</button>
          <button data-val="الظهران">الظهران</button>
          <button data-val="القطيف">القطيف</button>
          <button data-val="رأس تنورة">رأس تنورة</button>
        </div>
      </section>

      <button id="suggestBtn" disabled>اقترح لي</button>

      <div id="map"></div>

      <div id="results"></div>

      <!-- إدارة الأماكن -->
      <details id="manageSection" class="card">
        <summary>⚙️ إدارة الأماكن (متقدم)</summary>

        <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;">
          <button id="exportBtn" type="button">⬇️ تصدير الأماكن (JSON)</button>
          <label class="file-btn" style="display:inline-block; cursor:pointer;">
            ⬆️ استيراد من ملف
            <input type="file" id="importInput" accept="application/json" hidden />
          </label>
          <button id="resetBtn" type="button" style="background:#c53030;">🗑️ استعادة الافتراضي</button>
        </div>

        <p id="manageMsg" class="empty" style="margin-top:10px;"></p>

        <hr style="margin:16px 0; border:none; border-top:1px solid #eee;" />

        <form id="addPlaceForm" style="display:flex; flex-direction:column; gap:8px;">
          <strong>➕ إضافة مكان جديد</strong>
          <input name="name" placeholder="اسم المكان *" required />
          <input name="city" placeholder="المدينة" />
          <div style="display:flex; gap:8px;">
            <input name="lat" type="number" step="any" placeholder="خط العرض *" required />
            <input name="lng" type="number" step="any" placeholder="خط الطول *" required />
          </div>
          <select name="category" required>
            <option value="">-- التصنيف * --</option>
            <option value="كوفي">كوفي</option>
            <option value="مطعم">مطعم</option>
            <option value="حديقة">حديقة</option>
            <option value="سينما">سينما</option>
          </select>
          <div style="display:flex; gap:8px;">
            <input name="avg_time_minutes" type="number" placeholder="وقت الزيارة (دقيقة)" />
            <input name="budget" placeholder="الميزانية" />
          </div>
          <input name="description" placeholder="وصف" />
          <input name="notes" placeholder="ملاحظات" />
          <div style="display:flex; gap:8px;">
            <input name="rating" type="number" step="0.1" min="0" max="5" placeholder="التقييم (0-5)" />
            <input name="review_count" type="number" placeholder="عدد التقييمات" />
          </div>
          <button type="submit">حفظ المكان</button>
        </form>
      </details>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
